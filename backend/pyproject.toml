[project]
name = "enterprise-data-governance"
version = "1.0.0"
description = "Production-grade Enterprise Data Governance with pre-retrieval ACL filtering"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Pydantic
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.5",
    # OpenFGA client
    "openfga-sdk>=0.8.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    # HTTP client (for Ollama, OpenFGA)
    "httpx>=0.28.0",
    # Google Cloud Vertex AI
    "google-genai>=1.0.0",
    "google-auth>=2.30.0",
    # Embeddings (local, no API key needed)
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    # Document processing
    "pypdf2>=3.0.1",
    "python-docx>=1.1.2",
    "tiktoken>=0.8.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "anyio>=4.7.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Background jobs
    "anyio>=4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

